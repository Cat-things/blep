<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex">
  <title>Invite blep</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <script src="../config.js"></script>
  <script>
    // Redirect straight to Discord using the client ID from config.js.
    (function () {
      var c = window.BLEP_CONFIG || {};
      var id = String(c.clientId || "").trim();
      var perms = String(c.permissions || "8").trim() || "8";
      if (/^\d{15,25}$/.test(id)) {
        window.BLEP_INVITE =
          "https://discord.com/oauth2/authorize?client_id=" + encodeURIComponent(id) +
          "&permissions=" + encodeURIComponent(perms) + "&scope=bot+applications.commands";
        location.replace(window.BLEP_INVITE);
      }
    })();
  </script>
  <!-- No-JS fallback. config.js can't be read without JavaScript, so this URL is static:
       replace YOUR_CLIENT_ID here as well (see README.md). -->
  <noscript><meta http-equiv="refresh" content="0; url=https://discord.com/oauth2/authorize?client_id=YOUR_CLIENT_ID&amp;permissions=8&amp;scope=bot+applications.commands"></noscript>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main id="main-content" class="center-page">
    <div class="container">
      <div class="center-card">
        <svg class="mascot-sm" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="18" fill="#FF7AA2"/>
          <circle cx="14" cy="16" r="2.4" fill="#1B1B1F"/>
          <circle cx="26" cy="16" r="2.4" fill="#1B1B1F"/>
          <path d="M13 22c2.2 2 4.5 3 7 3s4.8-1 7-3" stroke="#1B1B1F" stroke-width="2" stroke-linecap="round" fill="none"/>
          <path d="M17.5 24.5h5v4.5a2.5 2.5 0 0 1-5 0z" fill="#E0457B"/>
        </svg>
        <h1 id="invite-title">Sending you to Discord&hellip;</h1>
        <p id="invite-message">Pick a server on the next screen and blep will be there in a second. If nothing happens, use the button below.</p>
        <div class="btn-row">
          <a class="btn btn-primary" id="invite-link" href="https://discord.com/oauth2/authorize?client_id=YOUR_CLIENT_ID&amp;permissions=8&amp;scope=bot+applications.commands">Invite blep</a>
          <a class="btn" href="../">Back home</a>
        </div>
      </div>
    </div>
  </main>
  <script>
    (function () {
      var link = document.getElementById("invite-link");
      if (window.BLEP_INVITE) {
        link.href = window.BLEP_INVITE;
        return;
      }
      // No client ID configured yet: explain instead of sending people to a broken Discord page.
      var c = window.BLEP_CONFIG || {};
      document.title = "Invite link not set up | blep";
      document.getElementById("invite-title").textContent = "Invite link isn't set up yet";
      document.getElementById("invite-message").textContent =
        "This copy of the site doesn't know the bot's client ID. If you run it, set clientId in config.js. " +
        "Otherwise, the support server can get you sorted.";
      link.href = c.support || "https://discord.gg/blep";
      link.textContent = "Join the support server";
    })();
  </script>
</body>
</html>
