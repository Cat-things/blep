<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex">
  <title>blep support server</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <script src="../config.js"></script>
  <script>
    // Redirect to the support server from config.js.
    (function () {
      var c = window.BLEP_CONFIG || {};
      window.BLEP_SUPPORT = String(c.support || "").trim() || "https://discord.gg/blep";
      location.replace(window.BLEP_SUPPORT);
    })();
  </script>
  <!-- No-JS fallback (static, since config.js needs JavaScript). -->
  <noscript><meta http-equiv="refresh" content="0; url=https://discord.gg/blep"></noscript>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main id="main-content" class="center-page">
    <div class="container">
      <div class="center-card">
        <svg class="mascot-sm" viewBox="0 0 64 64" aria-hidden="true">
  <path d="M11 5.5 L25.5 16.2 Q32 14.2 38.5 16.2 L53 5.5 C55.6 12.5 58.5 24 58.5 37 C58.5 51.5 46.5 60 32 60 C17.5 60 5.5 51.5 5.5 37 C5.5 24 8.4 12.5 11 5.5 Z" fill="#FF7AA2" stroke="#FF7AA2" stroke-width="4" stroke-linejoin="round"/>
  <path d="M11.6 22.5 L13.4 12 L22.8 18.6 Z M52.4 22.5 L50.6 12 L41.2 18.6 Z" fill="#E8548A" stroke="#E8548A" stroke-width="2.4" stroke-linejoin="round"/>
  <g class="eye"><ellipse cx="21.5" cy="35.5" rx="3.6" ry="4.4" fill="#1B1B1F"/><circle cx="22.8" cy="33.8" r="1.3" fill="#fff"/></g>
  <g class="eye"><ellipse cx="42.5" cy="35.5" rx="3.6" ry="4.4" fill="#1B1B1F"/><circle cx="43.8" cy="33.8" r="1.3" fill="#fff"/></g>
  <g class="tongue"><path d="M28.9 45.2 H35.1 V49.6 A3.1 3.1 0 0 1 28.9 49.6 Z" fill="#FF4F86" stroke="#C2265C" stroke-width="1.1" stroke-linejoin="round"/><path d="M32 47.4 V50.2" stroke="#C2265C" stroke-width="1.1" stroke-linecap="round"/></g>
  <path d="M30.3 41.4 H33.7 L32 43.3 Z" fill="#1B1B1F" stroke="#1B1B1F" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M32 43.4 V44.1 C32 45.7 30.9 46.6 29.5 46.6 C28.3 46.6 27.4 45.9 27 45 M32 44.1 C32 45.7 33.1 46.6 34.5 46.6 C35.7 46.6 36.6 45.9 37 45" fill="none" stroke="#1B1B1F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
        <h1>Taking you to the support server&hellip;</h1>
        <p>Questions, bug reports, feature ideas and cat pics all welcome. If nothing happens, use the button below.</p>
        <div class="btn-row">
          <a class="btn btn-primary" id="support-link" href="https://discord.gg/blep">Join the support server</a>
          <a class="btn" href="../">Back home</a>
        </div>
      </div>
    </div>
  </main>
  <script>
    if (window.BLEP_SUPPORT) document.getElementById("support-link").href = window.BLEP_SUPPORT;
  </script>
</body>
</html>
