<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex">
  <title>blep support server</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <script src="../config.js"></script>
  <script>
    // Redirect to the support server from config.js.
    (function () {
      var c = window.BLEP_CONFIG || {};
      window.BLEP_SUPPORT = String(c.support || "").trim() || "https://discord.gg/blep";
      location.replace(window.BLEP_SUPPORT);
    })();
  </script>
  <!-- No-JS fallback (static, since config.js needs JavaScript). -->
  <noscript><meta http-equiv="refresh" content="0; url=https://discord.gg/blep"></noscript>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main id="main-content" class="center-page">
    <div class="container">
      <div class="center-card">
        <svg class="mascot-sm" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="18" fill="#FF7AA2"/>
          <circle cx="14" cy="16" r="2.4" fill="#1B1B1F"/>
          <circle cx="26" cy="16" r="2.4" fill="#1B1B1F"/>
          <path d="M13 22c2.2 2 4.5 3 7 3s4.8-1 7-3" stroke="#1B1B1F" stroke-width="2" stroke-linecap="round" fill="none"/>
          <path d="M17.5 24.5h5v4.5a2.5 2.5 0 0 1-5 0z" fill="#E0457B"/>
        </svg>
        <h1>Taking you to the support server&hellip;</h1>
        <p>Questions, bug reports, feature ideas and cat pics all welcome. If nothing happens, use the button below.</p>
        <div class="btn-row">
          <a class="btn btn-primary" id="support-link" href="https://discord.gg/blep">Join the support server</a>
          <a class="btn" href="../">Back home</a>
        </div>
      </div>
    </div>
  </main>
  <script>
    if (window.BLEP_SUPPORT) document.getElementById("support-link").href = window.BLEP_SUPPORT;
  </script>
</body>
</html>
