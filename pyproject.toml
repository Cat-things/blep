[project]
name = "blep"
version = "1.0.0"
description = "A free, open-source multipurpose Discord bot. https://blep.wtf"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.7,<3",
    "asyncpg>=0.30",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "wavelink>=3.5,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
blep = "blep.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
