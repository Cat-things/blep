# Lavalink v4 configuration for Blep's music module (mounted by docker-compose.yml).
#
# Values written as ${NAME:default} are read from the container's environment:
#   LAVALINK_SERVER_PASSWORD        must match the bot's LAVALINK_PASSWORD
#   SPOTIFY_CLIENT_ID / _SECRET     optional, the same app as the bot's Spotify integration
#                                   (without them LavaSrc falls back to anonymous Spotify tokens)
#   APPLE_MUSIC_ENABLED             default true; with no token below one is fetched from music.apple.com
#                                   at startup (set to false if that fails and Lavalink won't start)
#   APPLE_MUSIC_MEDIA_API_TOKEN     optional
#   DEEZER_ENABLED                  set to true together with the two values below to stream from Deezer
#   DEEZER_MASTER_DECRYPTION_KEY    required by Deezer playback (LavaSrc refuses to start without it)
#   DEEZER_ARL                      the "arl" cookie of a Deezer account
#
# Blep searches Deezer first (dzsearch:) and falls back to YouTube Music and SoundCloud, so music works
# with Deezer disabled too. Spotify and Apple Music links are resolved by LavaSrc and streamed from the
# providers listed under plugins.lavasrc.providers.
#
# Plugin versions: bump them when YouTube breaks playback, see
#   https://github.com/lavalink-devs/youtube-source/releases
#   https://github.com/topi314/LavaSrc/releases

server:
  port: 2333
  address: 0.0.0.0
  http2:
    enabled: false

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      snapshot: false
  server:
    password: "${LAVALINK_SERVER_PASSWORD:youshallnotpass}"
    sources:
      youtube: false # replaced by the youtube-plugin above
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: false
      http: true # direct links and uploaded audio files
      local: false
    filters: # used by the `preset` commands
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    nonAllocatingFrameBuffer: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6 # pages of 100 tracks
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

plugins:
  youtube:
    enabled: true
    allowSearch: true # ytsearch: and ytmsearch:
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
    # Optional, helps when YouTube blocks the server's IP. See the youtube-source README.
    # oauth:
    #   enabled: true
    #   refreshToken: "${YOUTUBE_REFRESH_TOKEN:}"
    # remoteCipher:
    #   url: "http://yt-cipher:8001"
    #   password: "${YT_CIPHER_PASSWORD:}"

  lavasrc:
    # Where Spotify / Apple Music tracks are streamed from, tried in order.
    providers:
      - "dzisrc:%ISRC%" # only used when Deezer is enabled
      - "ytsearch:\"%ISRC%\""
      - "ytmsearch:%QUERY%"
      - "ytsearch:%QUERY%"
      - "scsearch:%QUERY%"
    sources:
      spotify: true # spsearch:, sprec: and open.spotify.com links
      applemusic: ${APPLE_MUSIC_ENABLED:true} # amsearch: and music.apple.com links
      deezer: ${DEEZER_ENABLED:false} # dzsearch:, dzisrc:, dzrec: and deezer.com links
      yandexmusic: false
      flowerytts: false
      youtube: false
      vkmusic: false
      tidal: false
      qobuz: false
      ytdlp: false
      jiosaavn: false
    lyrics-sources:
      spotify: false
      deezer: false
      youtube: false
      yandexmusic: false
      vkmusic: false
      lrcLib: false
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      countryCode: "US"
      playlistLoadLimit: 6 # pages of 100 tracks
      albumLoadLimit: 6 # pages of 50 tracks
      resolveArtistsInSearch: true
      localFiles: false
    applemusic:
      countryCode: "US"
      mediaAPIToken: "${APPLE_MUSIC_MEDIA_API_TOKEN:}"
      playlistLoadLimit: 6
      albumLoadLimit: 6
    deezer:
      masterDecryptionKey: "${DEEZER_MASTER_DECRYPTION_KEY:}"
      arl: "${DEEZER_ARL:}"
      formats: [ "MP3_128", "MP3_64" ] # FLAC / MP3_320 / MP3_256 / AAC_64 need a premium arl

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: false
    maxPayloadLength: 10000
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 7
